version: "2"

linters:
  enable:
    - gocyclo
    - godot
    - gosec
    - misspell
    - revive
    - staticcheck
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests use math/rand on purpose to get reproducible sequences.
      - path: _test\.go
        linters:
          - gosec
        text: G404

formatters:
  enable:
    - goimports
